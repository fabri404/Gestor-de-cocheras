{% extends "base.html" %}
{% block title %}Egreso{% endblock %}

{% block content %}
<div class="container px-3 px-md-0 pt-3" style="max-width: 520px;">

  <div class="mb-3">
    <h1 class="fc-section-title" style="font-size:1.35rem;">Egreso de vehículo</h1>
    <div class="fc-section-sub">Ingresá el ticket del movimiento para liberar el espacio.</div>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="fc-form-section">
      <label class="fc-label">Ticket / Alias <span class="text-danger">*</span></label>
      <input name="ticket" class="fc-input" placeholder="Ej: TKT-C0884038" required autofocus
             value="{{ ticket_prefill|default:'' }}">
    </div>

    <button class="fc-action-btn fc-action-btn--danger" type="submit">
      <i class="fa-solid fa-arrow-right-from-bracket"></i> Egresar
    </button>

    <a class="d-block text-center mt-3 text-decoration-none fc-section-sub" href="{% url 'dashboard' %}">Cancelar</a>
  </form>

</div>
{% endblock %}
